name: CI

# Four jobs, each independent of the others (no `needs:`), so a failure in one cannot switch
# another off. That is not hypothetical: from run #9 (eaa5e4b, 2026-09-24) to the fix, every run
# failed at the unit-test step, and because the regression gate, the dataset re-verification and
# the Langfuse integration suite were later steps of the same job, none of them ever executed on
# GitHub — every "gate passed" and "gate fired" in this project until then was a local replay
# (DECISIONS D-056). `make ci-local` runs these same `run:` blocks in a clean export of HEAD.
#
#   check          lint (ruff), type check (mypy --strict), the fast test suite;
#   integration    the Langfuse integration suite against a real local Langfuse (a skip is an error);
#   gate           re-verification of the frozen eval set, and the regression gate;
#   clean-install  install from pyproject.toml alone and import every module.
#
# The regression gate REPLAYS COMMITTED RUN ARTIFACTS: it reads evals/runs/v3_de699d68_pinned.json
# and its judge sheet and checks them against evals/baseline_metrics_pinned.json, then checks that
# an injected regression of the same artifact fails. No model is called here — there is no key in
# CI by design — so a code change that alters answers is not caught until the set is re-run and
# judged (DECISIONS D-050). Nothing requires this workflow to pass (DECISIONS D-023).

on:
  # Every branch, not just main. This project's working agreement is that Srikanth commits
  # to main directly and pull requests are never opened, so the conventional
  # `push: [main] + pull_request` pair would leave every phase branch untested — and the
  # first push of this file proved it, triggering nothing at all.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No key pair, so `langfuse_enabled` is False and every trace call degrades to a no-op.
  # The suite also disables observability itself (tests/conftest.py), and CI having no
  # backend to reach is the belt to that fix's braces.
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

jobs:
  check:
    name: lint · type · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts evals
          ruff format --check src tests scripts evals

      - name: Type check
        run: mypy src evals

      # `integration` is excluded rather than left to skip itself: it needs a six-container
      # Langfuse stack, and a job full of silent skips reads as green without testing much.
      - name: Tests
        run: pytest -q -m "not slow and not network and not integration"

  integration:
    name: Langfuse integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The integration suite is the ONLY automated coverage of the trace path, and every
      # Phase 3 tracing bug was found by a live run rather than a test. Making it skip when
      # Langfuse is down beat making it fail, but a permanently skipped test is a check that
      # never fires — the eighth D-023 instance. So CI stands the stack up and then *fails
      # if the suite did not actually run*: a skip here is an error, not a pass.
      - name: Integration tests against a real Langfuse
        env:
          LANGFUSE_PUBLIC_KEY: pk-lf-1a1a1a1a-2b2b-4c4c-8d8d-3e3e3e3e3e3e
          LANGFUSE_SECRET_KEY: sk-lf-4f4f4f4f-5a5a-4b6b-8c7c-6d6d6d6d6d6d
          LANGFUSE_HOST: http://localhost:3000
        run: |
          docker compose -f infra/docker-compose.langfuse.yml up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/public/health && break
            sleep 5
          done
          # `integration and not network`: the trace suite only. The multi-hop necessity
          # fixtures are marked `integration` too, but they call Gemini and CI has no key by
          # design — selected here they skip, and the first version of this check could not
          # see a partial skip (D-057).
          set +e
          pytest -q -m "integration and not network" --no-header -rs > integration.log 2>&1
          code=$?
          set -e
          cat integration.log
          summary=$(tail -n 1 integration.log)
          # Fail on any of: pytest failing (the first version piped `|| true`, so "1 failed,
          # 1 passed" read as green), any skip anywhere in the summary, or nothing collected.
          if [ "$code" -ne 0 ] || echo "$summary" | grep -qE "skipped|no tests ran" || \
             ! echo "$summary" | grep -qE "^[0-9]+ passed"; then
            echo "::error::the integration suite failed, skipped or did not run (exit $code):"
            echo "::error::$summary"
            exit 1
          fi

  gate:
    name: eval set + regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Narrow claim, stated in evals/verify_dataset.py: the artifact matches what the
      # builder claims about it. Both paths now share `classify_candidate`, so this cannot
      # find a check that is wrong or missing from the chain — the defect matrix carries
      # that. What it still catches is everything between a correct decision and the bytes
      # on disk: serialization loss, chunk-id drift, checksum mismatch, hand edits.
      - name: Re-verify the eval dataset
        # Runs even if an earlier step of this job failed: one failure must not hide the others.
        if: ${{ !cancelled() }}
        run: |
          if [ -f evals/datasets/phase4.json ]; then
            python -m evals.verify_dataset evals/datasets/phase4.json
          else
            echo "no dataset committed yet; skipping"
          fi

      # The regression gate. Tolerances are the max-min spread of three complete runs
      # (evals/baseline_metrics.json), not a round number — a move smaller than the spread is
      # not a move. Two assertions, because a gate that has only ever passed has not been
      # shown to fire: the committed baseline run must pass, and a deliberately regressed
      # copy of it must fail. The second is what makes the first mean anything.
      - name: Regression gate — baseline passes
        # Runs even if an earlier step of this job failed: one failure must not hide the others.
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f evals/baseline_metrics_pinned.json ]; then
            echo "no baseline committed; the gate refuses to run on an underived tolerance"
            exit 0
          fi
          # The shipped configuration: scope classifier pinned (D-035, D-044). Its baseline
          # is the mean of three pinned draws with their own max-min spread, derived by
          # evals/gate.py (the rule that also regenerates the Phase 4 baseline, which stays
          # committed beside it). The interim stricter-of-both gate is retired now that the
          # three-draw baseline has landed; `--baseline A --baseline B` still supports it.
          python -m evals.gate \
            --run evals/runs/v3_de699d68_pinned.json \
            --sheet evals/runs/scores_luna-low_de699d68_all_pinned.json \
            --baseline evals/baseline_metrics_pinned.json

      - name: Regression gate — an injected regression must fail it
        # Runs even if an earlier step of this job failed: one failure must not hide the others.
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f evals/baseline_metrics_pinned.json ]; then exit 0; fi
          python - <<'PY'
          import json, pathlib
          run = json.loads(pathlib.Path("evals/runs/v3_de699d68_pinned.json").read_text())
          # The injected regression: every retrieved chunk dropped. Recall@5 and MRR go to
          # zero; nothing else about the artifact changes.
          for item in run["items"].values():
              item["retrieved"] = []
          pathlib.Path("/tmp/regressed.json").write_text(json.dumps(run))
          PY
          # Exit 1 with the regression named, and nothing else: exit 2 is the gate *refusing*
          # its input (no baseline, an incomplete sheet), which is not the gate firing (D-053).
          set +e
          python -m evals.gate --run /tmp/regressed.json \
            --sheet evals/runs/scores_luna-low_de699d68_all_pinned.json \
            --baseline evals/baseline_metrics_pinned.json > /tmp/gate.out 2>&1
          code=$?
          set -e
          cat /tmp/gate.out
          if [ "$code" -ne 1 ] || ! grep -q "factual_recall@5: 0.000" /tmp/gate.out; then
            echo "::error::the gate did not fail the injected regression on recall (exit $code)"
            exit 1
          fi
          echo "the gate failed the injected regression, as it must"

  clean-install:
    name: install from a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Deliberately uncached. A warm pip cache can satisfy an undeclared import from a
          # wheel an earlier job happened to download, which is the same false green this
          # job exists to catch.

      - name: Install from pyproject.toml alone
        run: |
          python -m pip install --upgrade pip
          pip install .

      # The check that would have caught four undeclared dependencies (DECISIONS D-022).
      # `langchain`, `aiosqlite`, `langfuse`, and the OpenTelemetry packages were present in
      # the developer's venv and absent from the manifest: everything ran locally, every
      # test passed, and a fresh clone failed at import. A working environment is not
      # evidence of a working *declared* environment, and only an install from scratch can
      # tell the two apart.
      #
      # Importing from a directory that is not the repo root matters: running this at the
      # root would import `src/` from the working tree and prove nothing about what pip
      # actually installed.
      - name: Import every module from the installed distribution
        run: |
          mkdir -p /tmp/not-the-repo && cd /tmp/not-the-repo
          python - <<'PY'
          import importlib
          import pkgutil

          import src

          failed = []
          for module in pkgutil.walk_packages(src.__path__, prefix="src."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failed.append(f"{module.name}: {type(exc).__name__}: {exc}")

          if failed:
              print("Modules that do not import from a clean install:")
              for f in failed:
                  print(f"  - {f}")
              raise SystemExit(1)
          print("Every module imports from the declared dependencies alone.")
          PY
