[project]
name = "arxiv-agent-v3"
version = "0.1.0"
description = "Graph-orchestrated research agent over an arXiv ML corpus. LangGraph rebuild of arXiv-Agent v2.1."
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
    # ── Graph orchestration ────────────────────────────────────────────────
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    # ── Retrieval (ported from v2.1 — do not change without re-baselining) ──
    "faiss-cpu>=1.7.4",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "PyMuPDF>=1.25.5",
    "numpy>=1.26",
    "arxiv>=2.1.0",
    "httpx>=0.27",
    # ── Config / CLI ───────────────────────────────────────────────────────
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
arxiv-agent = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "ASYNC"]
ignore = [
    "ANN401", # Any is legitimate for **kwargs passthrough
    "B008",   # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["faiss.*", "rank_bm25.*", "fitz.*", "arxiv.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: loads the embedding model or the FAISS index",
    "network: makes a live outbound call",
]
